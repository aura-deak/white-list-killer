[project]
name = "white-list-killer"
version = "0.1.0"
description = "A Linux process cleanup tool based on whitelist"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
white-list-killer = "whitelist_killer.command_main:cli"

[tool.uv]
python-preference = "only-system"

[tool.hatch.build.targets.wheel]
packages = ["whitelist_killer"]